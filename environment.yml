name: brain_detector
channels:
  - pytorch         # official PyTorch channel (includes CUDA builds)
  - nvidia          # CUDA runtime libraries
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # ── Core scientific stack ───────────────────────────────────
  - numpy>=1.24,<2.1
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - tqdm>=4.65

  # ── Image processing ────────────────────────────────────────
  - pillow>=10.0

  # ── GUI / Visualization ─────────────────────────────────────
  - pyqt>=5.15        # napari Qt backend
  - napari>=0.4.19

  # ── PyTorch — installed via conda (CUDA build from pytorch channel) ──
  - pytorch>=2.6
  - torchvision
  - pytorch-cuda=12.4

  # ── pip-only packages ───────────────────────────────────────
  - pip
  - pip:
    # OpenCV (headless is lighter; replace with opencv-python if you need GUI)
    - opencv-python-headless>=4.8

    - tensorflow

    # Detection models
    - ultralytics>=8.0       # YOLOv8/v9 (YOLO class)
    - cellpose>=2.2          # nucleus segmentation
    - stardist>=0.8.0        # pretrained nucleus segmentation (TF backend)
    - csbdeep>=0.7.0         # StarDist image normalization
    - scikit-image>=0.21     # regionprops for StarDist post-processing
    - matplotlib>=3.7        # visualization and histogram generation
