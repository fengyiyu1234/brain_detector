name: brain_detector
channels:
  - pytorch         # official PyTorch channel (includes CUDA builds)
  - nvidia          # CUDA runtime libraries
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # ── Core scientific stack ───────────────────────────────────
  - numpy>=1.24,<2.1
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - tqdm>=4.65

  # ── Image processing ────────────────────────────────────────
  - pillow>=10.0

  # ── GUI / Visualization ─────────────────────────────────────
  - pyqt>=5.15        # napari Qt backend
  - napari>=0.4.19

  # ── pip-only packages ───────────────────────────────────────
  - pip
  - pip:
    # OpenCV (headless is lighter; replace with opencv-python if you need GUI)
    - opencv-python-headless>=4.8

    # PyTorch — CUDA 12.6 build (compatible with driver 560.x on Hazel HPC)
    # To reinstall: pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
    - torch==2.6.0+cu126
    - torchvision==0.21.0+cu126

    # Detection models
    - ultralytics>=8.0       # YOLOv8/v9 (YOLO class)
    - cellpose>=2.2          # nucleus segmentation
