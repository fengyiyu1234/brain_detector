name: brain_detector
channels:
  - pytorch         # provides CUDA-enabled pytorch/torchvision builds
  - nvidia          # provides CUDA runtime libraries
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # ── Core scientific stack ───────────────────────────────────
  - numpy>=1.24,<2.1
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - tqdm>=4.65

  # ── Image processing ────────────────────────────────────────
  - pillow>=10.0
  - opencv              # conda-forge headless-compatible build

  # ── PyTorch with CUDA (installed via conda pytorch channel) ─
  # Check HPC CUDA version first: nvcc --version  or  nvidia-smi
  # Then uncomment the matching block below and comment out the others.

  # CUDA 11.8:
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=11.8

  # CUDA 12.1:
  # - pytorch=2.1.2
  # - torchvision=0.16.2
  # - pytorch-cuda=12.1

  # CUDA 12.4:
  # - pytorch=2.1.2
  # - torchvision=0.16.2
  # - pytorch-cuda=12.4

  # ── pip-only packages ───────────────────────────────────────
  - pip
  - pip:
    - ultralytics>=8.0       # YOLOv8/v9
    - cellpose>=2.2          # nucleus segmentation
